<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2f33;--teal:#0f766e;--mint:#d9f2ec;--bg:#eef4f3;--card:#fff;--line:#d5e3e0;--amber:#d98a0b;--amberbg:#fff1d6;--ok:#16794a;--muted:#5d7478;--red:#b4332c}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(120deg,#0b2a2e,#0f766e);color:#fff;padding:22px 20px 70px}
.wrap{max-width:1040px;margin:0 auto}
header .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{width:62px;height:62px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 2px 10px rgba(0,0,0,.25)}h1{margin:0;font-size:22px}header p{margin:2px 0 0;opacity:.8;font-size:13px}
.btn{border:0;border-radius:10px;padding:9px 15px;font:inherit;font-weight:500;cursor:pointer;background:var(--teal);color:#fff}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.sec{background:var(--mint);color:var(--teal)}.btn.red{background:#fde8e6;color:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5b83d;outline-offset:1px}
main{margin-top:-48px;padding:0 16px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--muted);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input{flex:1;min-width:180px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:grid;gap:12px}
.bill{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:14px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s}
.bill:hover{box-shadow:0 6px 20px rgba(14,47,51,.12)}.bill.done{border-left-color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.bill h3{margin:0;font-size:17px}.sub{color:var(--muted);font-size:13px}
.badge{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;background:var(--amberbg);color:#8a5600}
.badge.ok{background:#d8f3e5;color:var(--ok)}
.prog{height:8px;border-radius:9px;background:#e3ecea;margin:11px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#34b6a6);border-radius:9px}
.empty{text-align:center;color:var(--muted);padding:44px 10px;background:#fff;border-radius:14px;border:1px dashed var(--line)}
#ov{position:fixed;inset:0;background:rgba(8,28,31,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:9}
#m{background:#fff;border-radius:18px;width:100%;max-width:680px;padding:20px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:0}}@media(prefers-reduced-motion:reduce){#m{animation:none}}
#m h2{margin:0 0 12px;font-size:19px}label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{display:grid;grid-template-columns:1fr 110px 34px;gap:6px;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chips .chip{padding:4px 11px;font-size:13px}.dots{display:flex;align-items:center;margin:14px 0 6px;overflow-x:auto;padding:4px 2px}.dot{flex:none;width:28px;height:28px;border-radius:50%;background:#e3ecea;color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700}.dot.d{background:var(--teal);color:#fff}.dot.n{background:var(--amberbg);color:#8a5600;box-shadow:0 0 0 2px var(--amber)}.dots i{flex:1;min-width:6px;height:3px;background:#e3ecea}.dots i.d{background:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.tl{position:relative;margin:8px 0 0 10px;padding-left:26px;border-left:3px solid var(--line)}
.st{position:relative;padding:0 0 18px}.st:last-child{padding-bottom:0}
.st:before{content:'';position:absolute;left:-37px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.st.d:before{background:var(--teal);border-color:var(--teal)}.st.n:before{border-color:var(--amber);background:var(--amberbg)}
.st.d{border-color:var(--teal)}.st b{font-weight:500}.st.p{color:#93a5a8}
.who{display:inline-block;background:var(--mint);color:var(--teal);border-radius:8px;padding:1px 9px;font-size:13px;margin-right:6px}
.act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.act select{flex:1;min-width:140px}.act .btn{padding:8px 12px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.tag{display:inline-flex;gap:5px;background:var(--mint);color:var(--teal);padding:3px 5px 3px 11px;border-radius:99px;margin:3px;font-size:13px}
.tag button{border:0;background:none;color:var(--red);cursor:pointer;font-size:15px}
pre{background:#0e2f33;color:#cfe;padding:10px;border-radius:10px;overflow:auto;font-size:12px;max-height:160px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:20}
.bars .r{display:grid;grid-template-columns:190px 1fr 125px 70px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.bars .b{height:14px;background:#e3ecea;border-radius:9px;overflow:hidden}.bars .b i{display:block;height:100%;background:var(--teal);border-radius:9px}.bars .slow .b i{background:var(--amber)}.bars .w{color:var(--muted);font-size:13px;text-align:right}
.rt{overflow-x:auto}.rt tr.k{cursor:pointer}.rt tr.k:hover{background:var(--bg)}.mini{display:inline-flex;gap:2px}.mini s{width:9px;height:9px;border-radius:50%;background:#e3ecea}.mini s.d{background:var(--teal)}.mini s.n{background:var(--amber)}h3.s{margin:20px 0 6px;font-size:16px}
@media(max-width:520px){.bars .r{grid-template-columns:100px 1fr 85px;font-size:12px}.bars .w{display:none}}
@media(max-width:520px){.g2{grid-template-columns:1fr}.it{grid-template-columns:1fr 90px 30px}}

const STEPS=['จัดทำใบประมาณการ','สั่งซื้อ','ลง e-GP ขั้น 1-4','รับของและใบส่งของ','กรรมการตรวจรับของ','คลังยาลงรับใน INV','ลง e-GP ขั้น 5-8','ตรวจชุดเอกสาร','ลงข้อมูลในโปรแกรมบัญชี','ทำชุดจ่ายเช็ค'];
let S=JSON.parse(localStorage.getItem('nakhuPO')||'null')||{bills:[],people:[],url:''};S.cos=S.cos||[];S.meds=S.meds||[];if(!S.url)S.url='https://script.google.com/macros/s/AKfycbxun95YnMRRvfAGc0RNIBoSdbSiQcU3oxpuipRhEVNawkMPylwSCLFrjO6C8A1hxpoh_Q/exec';
let flt='all',tmr;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
const money=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const total=b=>b.items.reduce((a,i)=>a+(+i.price||0),0);
const step=b=>b.steps.filter(Boolean).length;
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function save(){localStorage.setItem('nakhuPO',JSON.stringify(S));clearTimeout(tmr);if(S.url)tmr=setTimeout(()=>backup(true),3000);render()}
function render(){
 const B=S.bills,act=B.filter(b=>!b.done).length;
 $('stats').innerHTML=[['บิลทั้งหมด',B.length],['กำลังดำเนินการ',act],['สิ้นสุดแล้ว',B.length-act],['มูลค่ารวม (บาท)',money(B.reduce((a,b)=>a+total(b),0))]].map(s=>`<div class="stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('');
 $('chips').innerHTML=[['all','ทั้งหมด'],['open','กำลังดำเนินการ'],['done','สิ้นสุดแล้ว']].map(c=>`<button class="chip ${flt==c[0]?'on':''}" onclick="flt='${c[0]}';render()">${c[1]}</button>`).join(' ');
 const k=$('q').value.trim().toLowerCase();
 const L=B.filter(b=>(flt=='all'||(flt=='done')==b.done)&&(!k||(b.no+b.company+(b.name||'')).toLowerCase().includes(k))).sort((a,b)=>b.created-a.created);
 $('list').innerHTML=L.length?L.map(b=>{const n=step(b);return`<div class="bill ${b.done?'done':''}" onclick="openBill('${b.id}')"><div class="row"><h3>${esc(b.name||'บิล '+b.no)}</h3><span class="badge ${b.done?'ok':''}">${b.done?'สิ้นสุดแล้ว':'ขั้นที่ '+Math.min(n+1,10)+' / 10'}</span></div><div class="sub">เลขที่บิล ${esc(b.no)} · ${esc(b.company)}</div>
 <div class="prog"><i style="width:${n*10}%"></i></div><div class="row sub"><span>${b.done?'เสร็จสิ้นเมื่อ '+fmt(b.doneAt):n==10?'ครบทุกขั้นตอน รอกดสิ้นสุดบิล':'รอ: '+STEPS[n]}</span><span>${b.items.length} รายการ · ${money(total(b))} บาท</span></div></div>`}).join(''):'<div class="empty">ยังไม่มีบิล กดปุ่ม “+ เพิ่มบิลใหม่” เพื่อเริ่มติดตาม</div>';
}
function openM(h){$('m').style.maxWidth='';$('m').innerHTML=h;$('ov').style.display='flex'}function closeM(){$('ov').style.display='none'}
function itemRow(i={}){return`<div class="it"><input list="il" placeholder="ชื่อเวชภัณฑ์" value="${esc(i.name)}"><input type="number" min="0" step="0.01" placeholder="ราคา (บาท)" value="${i.price??''}"><button class="btn red" style="padding:0" onclick="this.parentNode.remove()" title="ลบรายการ">×</button></div>`}
function addRow(n=''){const r=[...document.querySelectorAll('#items .it')],l=r[r.length-1];
 if(n&&l&&!l.querySelector('input').value){l.querySelector('input').value=n;return}
 $('items').insertAdjacentHTML('beforeend',itemRow({name:n}))}
const chipB=(m,f)=>`<button class="chip" data-n="${esc(m)}" onclick="${f}">+ ${esc(m)}</button>`;
function openForm(id){
 const b=S.bills.find(x=>x.id==id)||{items:[{}],no:'',company:'',name:''};
 const cs=[...new Set([...S.cos,...S.bills.map(x=>x.company)])],ms=[...new Set([...S.meds,...S.bills.flatMap(x=>x.items.map(i=>i.name))])];
 openM(`<h2>${id?'แก้ไขบิล':'เพิ่มบิลใหม่'}</h2><label>ชื่อบิล</label><input id="fnm" placeholder="เช่น ยาประจำเดือน ต.ค. 69" value="${esc(b.name)}">
 <div class="g2"><div><label>เลขที่บิล</label><input id="fno" value="${esc(b.no)}"></div><div><label>บริษัท (พิมพ์ชื่อใหม่ ระบบจะจำไว้)</label><input id="fco" list="cl" value="${esc(b.company)}"></div></div>
 <datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="il">${ms.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 ${cs.length?`<div class="chips">${cs.slice(0,20).map(c=>chipB(c,"$('fco').value=this.dataset.n")).join('')}</div>`:''}
 <label>รายการเวชภัณฑ์ (ชื่อ / ราคา)</label><div id="items">${b.items.map(itemRow).join('')}</div>
 ${ms.length?`<label>เวชภัณฑ์ที่เคยบันทึก (กดเพื่อเพิ่ม)</label><div class="chips">${ms.slice(0,40).map(c=>chipB(c,"addRow(this.dataset.n)")).join('')}</div>`:''}
 <button class="btn sec" style="margin-top:6px" onclick="addRow()">+ เพิ่มรายการใหม่</button>
 <div class="foot"><button class="btn ghost" style="color:var(--muted)" onclick="closeM()">ยกเลิก</button><button class="btn" onclick="saveForm('${id||''}')">บันทึกบิล</button></div>`)}
function saveForm(id){
 const nm=$('fnm').value.trim(),no=$('fno').value.trim(),co=$('fco').value.trim();
 const items=[...document.querySelectorAll('#items .it')].map(r=>{const v=r.querySelectorAll('input');return{name:v[0].value.trim(),price:+v[1].value||0}}).filter(i=>i.name);
 if(!no||!co)return toast('กรอกเลขที่บิลและบริษัทก่อน');if(!items.length)return toast('เพิ่มรายการเวชภัณฑ์อย่างน้อย 1 รายการ');
 if(!S.cos.includes(co))S.cos.push(co);items.forEach(i=>{if(!S.meds.includes(i.name))S.meds.push(i.name)});
 if(id){Object.assign(S.bills.find(x=>x.id==id),{name:nm,no,company:co,items})}
 else S.bills.push({id:'b'+Date.now(),name:nm,no,company:co,items,steps:Array(10).fill(null),done:false,created:Date.now()});
 save();closeM();toast('บันทึกบิลแล้ว')}
function openBill(id){
 const b=S.bills.find(x=>x.id==id),n=step(b);
 const tl=STEPS.map((s,i)=>{const r=b.steps[i];
  if(r)return`<div class="st d"><b>${i+1}. ${s}</b><div class="sub">${fmt(r.t)} · <span class="who">${esc(r.by)}</span></div></div>`;
  if(i==n&&!b.done)return`<div class="st n"><b>${i+1}. ${s}</b><div class="act"><select id="by">${S.people.length?S.people.map(p=>`<option>${esc(p)}</option>`).join(''):'<option value="">— เพิ่มชื่อผู้รับผิดชอบ —</option>'}</select><button class="btn sec" onclick="addPerson(true,'${id}')">+ ชื่อ</button><button class="btn" onclick="mark('${id}')">บันทึกเวลา</button></div></div>`;
  return`<div class="st p">${i+1}. ${s}</div>`}).join('');
 const dots=`<div class="dots">${STEPS.map((x,i)=>`<span class="dot ${b.steps[i]?'d':i==n&&!b.done?'n':''}" title="${i+1}. ${x}">${i+1}</span>${i<9?`<i class="${b.steps[i]?'d':''}"></i>`:''}`).join('')}</div>`;
 openM(`<div class="row"><h2>${esc(b.name||'บิล '+b.no)}</h2><span class="badge ${b.done?'ok':''}">${b.done?'สิ้นสุดแล้ว':'ขั้นที่ '+Math.min(n+1,10)+' / 10'}</span></div><div class="sub">เลขที่บิล ${esc(b.no)} · ${esc(b.company)} · สร้างเมื่อ ${fmt(b.created)}</div>
 ${dots}<div class="tl">${tl}</div>${b.done?`<p class="sub">สิ้นสุดบิลเมื่อ ${fmt(b.doneAt)}</p>`:''}
 <table style="margin:16px 0 0"><tr><th>รายการเวชภัณฑ์</th><th class="r">ราคา (บาท)</th></tr>${b.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${money(i.price)}</td></tr>`).join('')}<tr><td><b>รวมทั้งสิ้น</b></td><td class="r"><b>${money(total(b))}</b></td></tr></table>
 <div class="foot"><button class="btn red" onclick="delBill('${id}')">ลบบิล</button>${!b.done?`<button class="btn sec" onclick="openForm('${id}')">แก้ไขรายการ</button>${n?`<button class="btn sec" onclick="undo('${id}')">ย้อนขั้นตอนล่าสุด</button>`:''}<button class="btn" style="background:var(--ok)" onclick="finish('${id}')">สิ้นสุดบิล</button>`:`<button class="btn sec" onclick="reopen('${id}')">เปิดบิลอีกครั้ง</button>`}<button class="btn ghost" style="color:var(--muted)" onclick="closeM()">ปิด</button></div>`)}
function addPerson(back,id){const p=(prompt('ชื่อผู้รับผิดชอบ')||'').trim();if(!p)return;if(!S.people.includes(p))S.people.push(p);save();back?openBill(id):openSet()}
function mark(id){const by=$('by').value;if(!by)return toast('เลือกหรือเพิ่มชื่อผู้รับผิดชอบก่อน');const b=S.bills.find(x=>x.id==id);b.steps[step(b)]={t:Date.now(),by};save();openBill(id);toast('บันทึกเวลาแล้ว')}
function undo(id){const b=S.bills.find(x=>x.id==id);if(confirm('ย้อนขั้นตอนล่าสุด?')){b.steps[step(b)-1]=null;save();openBill(id)}}
function finish(id){const b=S.bills.find(x=>x.id==id);if(step(b)<10&&!confirm('ยังทำไม่ครบ 10 ขั้นตอน ต้องการสิ้นสุดบิลเลยหรือไม่?'))return;b.done=true;b.doneAt=Date.now();save();openBill(id)}
function reopen(id){const b=S.bills.find(x=>x.id==id);b.done=false;save();openBill(id)}
function delBill(id){if(confirm('ลบบิลนี้ถาวร?')){S.bills=S.bills.filter(x=>x.id!=id);save();closeM()}}
function listSet(k,l){return`<label>${l}</label><div>${S[k].map((p,i)=>`<span class="tag">${esc(p)}<button onclick="S['${k}'].splice(${i},1);save();openSet()" title="ลบ">×</button></span>`).join('')||'<span class="sub">ยังไม่มี (ระบบจำจากบิลที่บันทึกให้อัตโนมัติ)</span>'}</div><button class="btn sec" style="margin-top:6px" onclick="addList('${k}')">+ เพิ่ม</button>`}
function addList(k){const p=(prompt('ชื่อ')||'').trim();if(p&&!S[k].includes(p)){S[k].push(p);save();openSet()}}
function durs(b){const o=[];let p=b.created;b.steps.forEach((r,i)=>{if(r){o[i]=Math.max(0,r.t-p);p=r.t}});return o}
const fmtD=ms=>{if(ms==null||isNaN(ms))return'-';const m=Math.round(ms/6e4);if(m<60)return m+' นาที';const h=Math.floor(m/60);if(h<24)return h+' ชม. '+(m%60)+' น.';return Math.floor(h/24)+' วัน '+(h%24)+' ชม.'};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function openReport(co=''){
 const cs=[...new Set(S.bills.map(b=>b.company))].sort(),L=S.bills.filter(b=>!co||b.company==co),now=Date.now();
 const av=STEPS.map((_,i)=>{const v=L.map(b=>durs(b)[i]).filter(x=>x!=null);return{a:avg(v),n:v.length,w:L.filter(b=>!b.done&&step(b)==i).length}});
 const mx=Math.max(1,...av.map(x=>x.a||0)),slow=av.reduce((m,x,i)=>x.a>(av[m].a||0)?i:m,0);
 const dn=L.filter(b=>b.done),tt=avg(dn.map(b=>b.doneAt-b.created));
 const cards=[['บิลทั้งหมด',L.length],['กำลังดำเนินการ',L.length-dn.length],['สิ้นสุดแล้ว',dn.length],['มูลค่ารวม (บาท)',money(L.reduce((a,b)=>a+total(b),0))],['เวลาเฉลี่ยต่อบิล',fmtD(tt)]];
 const mini=b=>`<span class="mini">${b.steps.map((r,i)=>`<s class="${r?'d':i==step(b)&&!b.done?'n':''}"></s>`).join('')}</span>`;
 openM(`<div class="row"><h2>รายงานภาพรวม${co?' · '+esc(co):''}</h2><select id="rc" style="width:auto;max-width:100%" onchange="openReport(this.value)"><option value="">ทุกบริษัท</option>${cs.map(c=>`<option value="${esc(c)}" ${c==co?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
 <div class="stats" style="margin:12px 0 0">${cards.map(c=>`<div class="stat"><b style="font-size:${String(c[1]).length>9?18:26}px">${c[1]}</b><span>${c[0]}</span></div>`).join('')}</div>
 <h3 class="s">เวลาเฉลี่ยของแต่ละขั้นตอน <span class="sub">(นับจากขั้นก่อนหน้า ขั้นที่ 1 นับจากวันสร้างบิล)</span></h3>
 <div class="bars">${STEPS.map((s,i)=>`<div class="r ${i==slow&&av[i].a?'slow':''}"><span>${i+1}. ${s}</span><span class="b"><i style="width:${av[i].a?Math.max(3,av[i].a/mx*100):0}%"></i></span><span>${fmtD(av[i].a)}</span><span class="w">ค้าง ${av[i].w} บิล</span></div>`).join('')}</div>
 ${av[slow].a?`<p class="sub">ขั้นตอนที่ใช้เวลานานที่สุด: ${slow+1}. ${STEPS[slow]} (สีส้ม)</p>`:'<p class="sub">ยังไม่มีข้อมูลเวลา เริ่มบันทึกขั้นตอนในบิลก่อน</p>'}
 ${co?'':`<h3 class="s">สรุปรายบริษัท <span class="sub">(กดแถวเพื่อดูเฉพาะบริษัท)</span></h3><div class="rt"><table><tr><th>บริษัท</th><th class="r">บิล</th><th class="r">ค้าง</th><th class="r">เสร็จ</th><th class="r">มูลค่า</th><th class="r">เวลาเฉลี่ย/บิล</th></tr>${cs.map(c=>{const x=S.bills.filter(b=>b.company==c),d=x.filter(b=>b.done);return`<tr class="k" data-c="${esc(c)}" onclick="openReport(this.dataset.c)"><td>${esc(c)}</td><td class="r">${x.length}</td><td class="r">${x.length-d.length}</td><td class="r">${d.length}</td><td class="r">${money(x.reduce((a,b)=>a+total(b),0))}</td><td class="r">${fmtD(avg(d.map(b=>b.doneAt-b.created)))}</td></tr>`}).join('')||'<tr><td colspan="6" class="sub">ยังไม่มีข้อมูล</td></tr>'}</table></div>`}
 <h3 class="s">สถานะแต่ละบิล</h3><div class="rt"><table><tr><th>บิล</th><th>ขั้นตอนปัจจุบัน</th><th>ความคืบหน้า</th><th class="r">ใช้เวลา</th></tr>${L.slice().sort((a,b)=>a.done-b.done||b.created-a.created).map(b=>`<tr class="k" onclick="openBill('${b.id}')"><td>${esc(b.name||'บิล '+b.no)}<div class="sub">${esc(b.no)}${co?'':' · '+esc(b.company)}</div></td><td>${b.done?'สิ้นสุดแล้ว':step(b)==10?'ครบทุกขั้นตอน':(step(b)+1)+'. '+STEPS[step(b)]}</td><td>${mini(b)}</td><td class="r">${fmtD((b.done?b.doneAt:now)-b.created)}</td></tr>`).join('')||'<tr><td colspan="4" class="sub">ยังไม่มีบิล</td></tr>'}</table></div>
 <div class="foot"><button class="btn ghost" style="color:var(--muted)" onclick="closeM()">ปิด</button></div>`);
 $('m').style.maxWidth='980px'}
function openSet(){openM(`<h2>ตั้งค่า / สำรองข้อมูล</h2><label>ผู้รับผิดชอบ</label><div>${S.people.map((p,i)=>`<span class="tag">${esc(p)}<button onclick="S.people.splice(${i},1);save();openSet()" title="ลบ">×</button></span>`).join('')||'<span class="sub">ยังไม่มีรายชื่อ</span>'}</div><button class="btn sec" style="margin-top:6px" onclick="addPerson()">+ เพิ่มชื่อ</button>
 ${listSet('cos','บริษัทที่จำไว้')}${listSet('meds','รายการเวชภัณฑ์ที่จำไว้')}<label>Google Apps Script Web App URL (สำรองอัตโนมัติทุกครั้งที่บันทึก)</label><input id="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(S.url)}" onchange="S.url=this.value.trim();save()">
 <div class="act"><button class="btn" onclick="backup()">สำรองข้อมูลตอนนี้</button><button class="btn sec" onclick="restore()">กู้คืนจาก Google</button><button class="btn sec" onclick="exportJ()">ดาวน์โหลด JSON</button><button class="btn sec" onclick="$('imp').click()">นำเข้า JSON</button><input id="imp" type="file" accept=".json" hidden onchange="importJ(this)"></div>
 <label>โค้ด Google Apps Script (วางใน script.google.com แล้ว Deploy เป็น Web app, Anyone)</label><pre>${esc(GS)}</pre><button class="btn sec" onclick="navigator.clipboard.writeText(GS);toast('คัดลอกโค้ดแล้ว')">คัดลอกโค้ด</button>
 <div class="foot"><button class="btn ghost" style="color:var(--muted)" onclick="closeM()">ปิด</button></div>`)}
const GS=`const FILE='nakhu_po_backup.json';
function find_(){const f=DriveApp.getFilesByName(FILE);return f.hasNext()?f.next():null}
function doPost(e){const f=find_();
  if(f)f.setContent(e.postData.contents);else DriveApp.createFile(FILE,e.postData.contents);
  return ContentService.createTextOutput('ok')}
function doGet(){const f=find_();
  return ContentService.createTextOutput(f?f.getBlob().getDataAsString():'{}').setMimeType(ContentService.MimeType.JSON)}`;
async function backup(quiet){if(!S.url)return toast('ใส่ URL ของ Apps Script ก่อน');
 try{await fetch(S.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({bills:S.bills,people:S.people,cos:S.cos,meds:S.meds,at:Date.now()})});if(!quiet)toast('สำรองข้อมูลแล้ว')}catch(e){toast('สำรองไม่สำเร็จ ตรวจสอบ URL')}}
async function restore(){if(!S.url)return toast('ใส่ URL ของ Apps Script ก่อน');if(!confirm('แทนที่ข้อมูลในเครื่องด้วยข้อมูลสำรอง?'))return;
 try{const d=await (await fetch(S.url)).json();if(!d.bills)return toast('ไม่พบข้อมูลสำรอง');S.bills=d.bills;S.people=d.people||[];S.cos=d.cos||[];S.meds=d.meds||[];save();toast('กู้คืนข้อมูลแล้ว')}catch(e){toast('กู้คืนไม่สำเร็จ ตรวจสอบ URL')}}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nakhu_po_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importJ(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.bills)throw 0;S={...S,bills:d.bills,people:d.people||[],cos:d.cos||S.cos,meds:d.meds||S.meds};save();toast('นำเข้าแล้ว')}catch(e){toast('ไฟล์ไม่ถูกต้อง')}};r.readAsText(i.files[0])}
render();
if(!S.bills.length&&S.url)fetch(S.url).then(r=>r.json()).then(d=>{if(d.bills&&d.bills.length&&!S.bills.length){S.bills=d.bills;S.people=d.people||[];S.cos=d.cos||[];S.meds=d.meds||[];save();toast('ดึงข้อมูลสำรองจาก Google แล้ว')}}).catch(()=>{});
</script></body></html>
